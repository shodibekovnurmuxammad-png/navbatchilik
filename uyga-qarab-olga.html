<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uyga qarab olg’a</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--acc:#1d7a5f;--accink:#fff;--bad:#c0392b;--line:#ddd9cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222426;--ink:#f1efe8;--mute:#9b9a92;--acc:#3fb58f;--accink:#08130f;--bad:#ef6f60;--line:#34363a}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222426;--ink:#f1efe8;--mute:#9b9a92;--acc:#3fb58f;--accink:#08130f;--bad:#ef6f60;--line:#34363a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0 4px}
p.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=number]{width:100%;font-size:22px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:12px}.row>div{flex:1}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 18px;background:var(--acc);color:var(--accink);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.full{width:100%;margin-top:14px}
.hint{color:var(--mute);font-size:14px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.num{font-size:26px;font-weight:800;border-radius:14px;background:var(--card);color:var(--ink);border:2px solid var(--line);padding:12px 6px;line-height:1.2}
.num small{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-top:4px}
.num.lose small{color:#fff}
.num.taken{opacity:.3;pointer-events:none;text-decoration:line-through}
.num.lose{background:var(--bad);color:#fff;border-color:var(--bad);opacity:1;text-decoration:none}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov.on{display:flex}
.box{background:var(--card);border-radius:20px;padding:28px 22px;width:100%;max-width:360px;text-align:center}
.big{font-size:64px;font-weight:800;margin:6px 0}
.role{font-size:26px;font-weight:800;margin:10px 0}
.safe{color:var(--acc)}.lose-t{color:var(--bad)}
.hide{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
#theme{padding:10px 14px;font-size:20px;line-height:1}
</style>
</head>
<body>
<main>
<div class="top"><h1>🏠 Uyga qarab olg’a</h1><button class="ghost" id="theme" aria-label="Rejimni almashtirish">🌙</button></div>
<p class="sub">Kim mafiya bo‘lsa pol artadi! 🧹</p>

<section id="setup" class="card">
  <div class="row">
    <div><label for="n">O‘quvchilar soni</label><input id="n" type="number" min="3" max="100" value="30" inputmode="numeric"></div>
    <div><label for="m">Mafiyalar soni</label><input id="m" type="number" min="1" max="99" value="1" inputmode="numeric"></div>
  </div>
  <p class="hint">Eng ko‘pi bilan 100 ta o‘yinchi. Mafiyalar sonini o‘zingiz kiritasiz. Raqamlar 1 dan boshlab beriladi.</p>
  <button class="full" id="start">O‘yinni boshlash</button>
</section>

<section id="game" class="hide">
  <div class="bar">
    <strong id="left"></strong>
    <button class="ghost" id="reset">Qaytadan</button>
  </div>
  <p class="sub" id="tip">Har bir o‘quvchi navbat bilan bitta raqamni tanlaydi. Boshqalar ekranga qaramasin!</p>
  <div class="grid" id="grid"></div>
  <button class="full" id="finish">Natijani ko‘rsatish</button>
</section>

<section id="result" class="card hide">
  <h2 style="margin-top:0">Natija</h2>
  <p id="resText"></p>
  <button class="full" id="again">Yangi o‘yin</button>
</section>
</main>

<div class="ov" id="ov"><div class="box" id="box"></div></div>

<script>
var $=function(i){return document.getElementById(i)};
var N=0,M=1,roles=[],taken=[],cur=0;

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){["setup","game","result"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}

$("start").onclick=function(){
  var n=parseInt($("n").value,10),m=parseInt($("m").value,10);
  if(!(n>=3&&n<=100)){alert("O‘quvchilar soni 3 dan 100 gacha bo‘lsin.");return}
  if(!(m>=1&&m<n)){alert("Mafiyalar soni kamida 1 bo‘lsin va o‘quvchilar sonidan kam bo‘lsin.");return}
  N=n;M=m;
  roles=[];for(var i=0;i<N;i++)roles.push(i<M?"mafia":"safe");
  shuffle(roles);taken=[];
  draw();show("game");
};

function draw(reveal){
  var g=$("grid");g.innerHTML="";
  for(var i=0;i<N;i++){
    var b=document.createElement("button");
    b.className="num";b.innerHTML=(i+1)+"<small>Meni tanla, uyga ketamiz 🏠</small>";
    if(taken.indexOf(i)>-1)b.classList.add("taken");
    if(reveal&&roles[i]==="mafia")b.classList.add("lose");
    if(reveal)b.style.pointerEvents="none";
    (function(k){b.onclick=function(){pick(k)}})(i);
    g.appendChild(b);
  }
  $("left").textContent="Qolgan raqamlar: "+(N-taken.length)+" / "+N;
}

function pick(i){
  cur=i;
  $("box").innerHTML='<div>Siz tanlagan raqam</div><div class="big">'+(i+1)+'</div><p class="hint">Faqat o‘zingiz qarang. Tayyor bo‘lsangiz, rolni oching.</p><button class="full" id="open">Rolni ochish</button><button class="full ghost" id="cancel">Bekor qilish</button>';
  $("ov").classList.add("on");
  $("open").onclick=reveal;
  $("cancel").onclick=function(){$("ov").classList.remove("on")};
}

function reveal(){
  var bad=roles[cur]==="mafia";
  taken.push(cur);
  $("box").innerHTML='<div>Raqam '+(cur+1)+'</div><div class="role '+(bad?"lose-t":"safe")+'">'+(bad?"🕵️ MAFIYA":"🏠 Tabriklaymiz!")+'</div><p>'+(bad?"Afsus, bugun navbatchi — sizsiz!":"Tabriklaymiz, siz uyga yo‘l oldingiz!")+'</p><button class="full" id="close">Yopish</button>';
  $("close").onclick=function(){
    $("ov").classList.remove("on");draw();
    if(taken.length===N)done();
  };
}

function done(){
  var list=[];for(var i=0;i<N;i++)if(roles[i]==="mafia")list.push(i+1);
  $("resText").innerHTML="Bugungi navbatchi: <strong class=\"lose-t\">№ "+list.join(", № ")+"</strong>";
  show("result");
}
$("finish").onclick=function(){
  if(taken.length<N&&!confirm("Hali hamma raqam tanlanmadi. Baribir natijani ko‘rsataymi?"))return;
  var list=[];for(var i=0;i<N;i++)if(roles[i]==="mafia")list.push(i+1);
  $("resText").innerHTML="Mafiya (navbatchi) raqami: <strong class=\"lose-t\">№ "+list.join(", № ")+"</strong>";
  show("result");
};
$("reset").onclick=function(){if(confirm("O‘yin boshidan boshlansinmi?"))show("setup")};
$("again").onclick=function(){show("setup")};
var root=document.documentElement;
function isDark(){var t=root.getAttribute("data-theme");if(t)return t==="dark";return window.matchMedia("(prefers-color-scheme: dark)").matches}
function paint(){$("theme").textContent=isDark()?"☀️":"🌙"}
try{var saved=localStorage.getItem("theme");if(saved)root.setAttribute("data-theme",saved)}catch(e){}
$("theme").onclick=function(){var next=isDark()?"light":"dark";root.setAttribute("data-theme",next);try{localStorage.setItem("theme",next)}catch(e){}paint()};
paint();
</script>
</body>
</html>
